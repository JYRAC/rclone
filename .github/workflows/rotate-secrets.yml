name: Rotate rclone-gdrive shared key

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  OPENBAO_NB_IP: "100.125.124.43"
  OPENBAO_NB_NAME: "openbao.netbird.cloud"

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to NetBird
        env:
          NB_SETUP_KEY_ACTIONS: ${{ secrets.NETBIRD_SETUP_KEY_ACTIONS }}
        run: |
          set +e
          NB_VER=0.81.5
          if [ -z "${NB_SETUP_KEY_ACTIONS:-}" ]; then
            echo "::warning::NETBIRD_SETUP_KEY_ACTIONS が未設定です。NetBird には参加しません（公開側に接続します）"
            exit 0
          fi
          echo "::add-mask::$NB_SETUP_KEY_ACTIONS"

          # OpenBao の証明書（公開情報。各アプリの openbao/ca.crt と同じもの）
          cat > /tmp/openbao-ca.crt <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIBuDCCAV6gAwIBAgIUGrPzmEUmBP5KAGnQZVeUgsrpOyowCgYIKoZIzj0EAwIw
          IDEeMBwGA1UEAwwVb3BlbmJhby5uZXRiaXJkLmNsb3VkMB4XDTI2MTExMDAzNDIy
          MFoXDTI3MTExMDAzNDIyMFowIDEeMBwGA1UEAwwVb3BlbmJhby5uZXRiaXJkLmNs
          b3VkMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYHp7reFD9TWjQrS3Bb0e4S4L
          DHF59f9xSNVHgy8NVduUdi2Y16JvWOXRvphyNf0UQ4ogD5apIKnnYUWPWbnlp6N2
          MHQwDAYDVR0TAQH/BAIwADAOBgNVHQ8BAf8EBAMCB4AwEwYDVR0lBAwwCgYIKwYB
          BQUHAwEwIAYDVR0RBBkwF4IVb3BlbmJhby5uZXRiaXJkLmNsb3VkMB0GA1UdDgQW
          BBTPdnfkV+COni53ttlizaut+Vel2jAKBggqhkjOPQQDAgNIADBFAiEAttmWJRc7
          X6zYBLJKDp13ENef8AcYj2UZ3l7Jic7LWjwCIDMcO2Ip5dyCRJvLXSQvyvBifIj0
          eWX6nDBMkDHcyRru
          -----END CERTIFICATE-----
          PEM

          fail() {
            echo "::warning::NetBird に接続できませんでした: $1（公開側に接続します）"
            sudo netbird down >/dev/null 2>&1
            exit 0
          }

          curl -fsSL -o /tmp/netbird.tgz \
            "https://github.com/netbirdio/netbird/releases/download/v${NB_VER}/netbird_${NB_VER}_linux_amd64.tar.gz" || fail "ダウンロード"
          tar -xzf /tmp/netbird.tgz -C /tmp netbird || fail "展開"
          sudo install -m 0755 /tmp/netbird /usr/local/bin/netbird
          sudo netbird service install >/dev/null 2>&1
          sudo netbird service start || fail "サービスの起動"

          # DNS には触らせない（ランナーの名前解決を変えない）。ホスト名は、ピアの一覧で見分けるため。
          sudo netbird up --setup-key "$NB_SETUP_KEY_ACTIONS" \
            --hostname "gh-${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}" --disable-dns \
            > /tmp/nb-up.log 2>&1 || { tail -n 5 /tmp/nb-up.log; fail "netbird up"; }

          # OpenBao（8210）に届くまで待つ（最大60秒）。応答の中身（HTTPの値）は問わない。
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              --cacert /tmp/openbao-ca.crt \
              --resolve "${OPENBAO_NB_NAME}:8210:${OPENBAO_NB_IP}" \
              "https://${OPENBAO_NB_NAME}:8210/v1/sys/health")
            if [ "$code" != "000" ]; then
              echo "NB: OpenBao に届きました (HTTP $code)"
              echo "NB_UP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          fail "OpenBao に届きません（ポリシー、証明書、OpenBao の起動を確認）"

      - name: Generate and write new key pair
        run: |
          set -u
          BAO_ADDR=https://openbao.jyrac.stki.org
          # BAO_ADDR は、JWT の audience（OpenBao のロールの bound_audiences）として使う。接続先ではない。
          # 接続先は、NetBird に参加できていれば NetBird 経由、できていなければ公開側。
          BAO_CURL=(curl -s)
          BAO_URL="$BAO_ADDR"
          if [ "${NB_UP:-}" = "1" ]; then
            BAO_CURL=(curl -s --cacert /tmp/openbao-ca.crt --resolve "${OPENBAO_NB_NAME}:8210:${OPENBAO_NB_IP}")
            BAO_URL="https://${OPENBAO_NB_NAME}:8210"
            echo "OpenBao: NetBird 経由で接続します"
          else
            echo "::warning::NetBird 経由ではなく、公開側の OpenBao に接続します"
          fi

          JWT=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BAO_ADDR" | jq -r .value)

          LOGIN_RESP=$("${BAO_CURL[@]}" -X POST \
            -d "{\"role\":\"rclone-rotate\",\"jwt\":\"$JWT\"}" \
            "$BAO_URL/v1/auth/jwt/login")

          TOKEN=$(echo "$LOGIN_RESP" | jq -r .auth.client_token)

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Login failed:"; echo "$LOGIN_RESP"; exit 1
          fi

          NEW_ACCESS_KEY=$(openssl rand -hex 10)
          NEW_SECRET_KEY=$(openssl rand -hex 20)

          "${BAO_CURL[@]}" -X POST -H "X-Vault-Token: $TOKEN" \
            -d "$(jq -n --arg a "$NEW_ACCESS_KEY" --arg s "$NEW_SECRET_KEY" \
              '{data: {access_key: $a, secret_key: $s}}')" \
            "$BAO_URL/v1/kv/data/secrets/shared/rclone-gdrive"

          echo "Rotated rclone-gdrive shared key. Both rclone and directus Agents will pick it up within ~5 minutes."

      - name: Disconnect NetBird
        if: always()
        run: sudo netbird down >/dev/null 2>&1 || true
