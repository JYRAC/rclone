services:
 - type: web
   name: rclone-directus
   runtime: docker
   dockerfilePath: ./Dockerfile
   plan: free
   envVars:
     - key: RCLONE_CONFIG_GDRIVE_TYPE
       value: "drive"
     - key: RCLONE_CONFIG_GDRIVE_SCOPE
       value: "drive"
     - key: RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID
       value: "1JKruQklTVP1PhvMjguoUBM89BWxzBHWP"
     - key: RCLONE_LOG_LEVEL
       value: "INFO"
     - key: RCLONE_USE_JSON_LOG
       value: "true"
     # ---- NetBird ----
     # NB_SETUP_KEY（仮のピアの、使い捨てキー）は、deploy-secrets.yml が、デプロイのたびに作って渡すので、ここには書かない。
     # 固定のピアの設定（NB_CONFIG_B64）と、HTTPS の証明書と鍵は、OpenBao の kv/secrets/rclone/config から受け取る。
     - key: NB_HOSTNAME
       value: "rclone"
     - key: OPENBAO_NB_ADDR
       value: "https://100.125.124.43:8210"
